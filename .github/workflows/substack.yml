name: Refresh Substack posts

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_substack.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No new posts"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json index.html insights.html
          git commit -m "Refresh Substack posts"
          git push
